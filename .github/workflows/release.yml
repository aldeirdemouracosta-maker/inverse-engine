name: executaveis
# Monta AppImage (Linux) e .exe (Windows) e publica na página de Releases. Dois jeitos:
# - enviar uma tag "v*" (ex.: v0.11.0);
# - Actions → executaveis → "Run workflow": cria a tag v<__version__> no commit escolhido.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-22.04  # glibc mais antiga: o AppImage roda em distros de 2022 em diante
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libglib2.0-0 libdbus-1-3 xvfb libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xkb1 libxcb-image0 libxcb-render-util0 libxcb-randr0
        # as libxcb-* entram no AppImage: sem elas a janela não abre em sistemas que não as têm
      - run: pip install PySide6 pyinstaller
      - run: python -m unittest discover -s tests -t .
      - run: python packaging/build.py
      - run: packaging/appimage.sh
      - name: teste rápido do AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          XDG_DATA_HOME: ${{ runner.temp }}/xdg
        run: |
          dist/InverseEngine-x86_64.AppImage findings | head -3
          QT_QPA_PLATFORM=xcb xvfb-run -a -s "-screen 0 1366x768x24" sh -c '
            dist/InverseEngine-x86_64.AppImage & PID=$!; sleep 15
            kill -0 $PID || { echo "a interface fechou sozinha"; exit 1; }; kill $PID'
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/InverseEngine-x86_64.AppImage
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PySide6 pyinstaller
      - run: python packaging/build.py
      - name: teste rápido do .exe
        shell: bash
        run: dist/inverse-engine-cli.exe findings | head -3
      - name: abrir a interface e fotografar a tela
        shell: pwsh
        run: |
          Start-Process dist\InverseEngine.exe
          Start-Sleep -Seconds 25
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("tela-windows.png")
          if (-not (Get-Process InverseEngine -ErrorAction SilentlyContinue)) { throw "a interface fechou sozinha" }
          Stop-Process -Name InverseEngine -Force
      - uses: actions/upload-artifact@v4
        with:
          name: tela-windows
          path: tela-windows.png
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/InverseEngine.exe
            dist/inverse-engine-cli.exe
  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: versão
        id: v
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else echo "tag=v$(python3 -c 'import inverse_engine; print(inverse_engine.__version__)')" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Inverse Engine ${{ steps.v.outputs.tag }}
          files: dist/*
          generate_release_notes: true
