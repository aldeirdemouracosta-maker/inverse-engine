name: testes
on: [push, pull_request]
jobs:
  testes:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.12"]
        include:
          - os: windows-latest
            python: "3.12"
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "0"  # testa o Windows como ele é: sem UTF-8 por padrão
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libglib2.0-0 libdbus-1-3
      - run: pip install PySide6
      - run: python -m unittest discover -s tests -t . -v
